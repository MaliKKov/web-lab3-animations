
<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Анимация №3 — Конверт</title>
    <link rel="stylesheet" href="css/styles.css">
</head>
<body class="envelope-page">

    <main class="envelope-main">
        <h1>Анимация №3 — Конверт</h1>

        <p>Наведите курсор на конверт, чтобы открыть письмо.</p>

        <div class="envelope-scene">

            <div class="mail-envelope" tabindex="0"
                 role="img"
                 aria-label="Красный конверт с выдвигающимся письмом">

                <!-- Задняя часть конверта -->
                <div class="envelope-back"></div>

                <!-- Письмо -->
                <div class="envelope-letter">
                    <div class="letter-stripes"></div>

                    <div class="letter-content">
                        <span class="letter-line line-long"></span>
                        <span class="letter-line line-medium"></span>
                        <span class="letter-line line-short"></span>
                    </div>

                    <div class="letter-stamp"></div>
                </div>

                <!-- Верхняя открывающаяся часть -->
                <div class="envelope-flap"></div>

                <!-- Передняя часть конверта -->
                <div class="envelope-front"></div>
            </div>

            <div class="envelope-shadow"></div>
        </div>

        <nav class="animation-nav">
            <a href="candles.html">← Свечи</a>
            <a href="index.html">Все анимации</a>
            <a href="snowglobe.html">Снежный шар →</a>
        </nav>
    </main>

</body>
</html>
